
<div class="menubar-container">
    <p-menubar [model]="apartados" >
        <p-progressSpinner *ngIf="loading$ | async" fill="var(--surface-ground)" [style]="{'width': '5%', 'height': '5%'}" animationDuration=".6s" class="fadein animation-duration-1000"></p-progressSpinner>
        <p-button   [disabled]="!isFiltrado" (click)="limpiarFiltros()"   icon="pi pi-filter-slash" [outlined]="true"  [severity]="'danger'"  class="ml-2"></p-button>
        
        <p-button class="ml-2" *ngIf="apartado_seleccionado === 'muebles'"  (onClick)=" showingSelectElementosFiltroDialog = !showingSelectElementosFiltroDialog" [outlined]="true" [severity]="'danger'" label="Agrupar por elementos"></p-button>

        <p-dialog [(visible)]="showingSelectElementosFiltroDialog" [style]="{width: '80%'}" header="Filtrar por elementos" [modal]="true" [closable]="true" [draggable]="false" [resizable]="false">
         <app-multipleSelectorElementos (selectedElementosIds)=" onSelectedElementosIds($event)"></app-multipleSelectorElementos>
        </p-dialog>

        <p-calendar 
            class="ml-2"
            [(ngModel)]="periodo_fechas" 
            view="month" 
            dateFormat="mm/yy" 
            [readonlyInput]="true"
            selectionMode="range"
            [showIcon]="true"
            (onSelect)="filtrarPorFecha()">
        </p-calendar>
        
    </p-menubar>

</div>

<div [ngSwitch]="apartado_seleccionado$ | async" >
    <app-estadisticas-auditoria *ngSwitchCase="'auditorias'"></app-estadisticas-auditoria>
    <!-- <app-estadisticas-tiendas *ngSwitchCase="'tiendas'"></app-estadisticas-tiendas> -->
    <app-estadisticas-muebles *ngSwitchCase="'muebles'"></app-estadisticas-muebles>
    <!-- <app-estadisticas-elementos *ngSwitchCase="'elementos'"></app-estadisticas-elementos> -->
    <app-estadisticas-uniformes *ngSwitchCase="'uniformes'"></app-estadisticas-uniformes>
    <app-estadisticas-ia *ngSwitchCase="'ia'"></app-estadisticas-ia>
    <div *ngSwitchDefault></div>
</div>
